name: Build APK

# Builds on every push/PR, and publishes a GitHub Release when you push a tag
# like `v1.0.0`. The runner already ships the Android SDK, so nothing has to be
# installed manually.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  # Lets you trigger a build by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write   # required by the release step

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --continue
        continue-on-error: true

      # The APK lands here; download it from the "Artifacts" section of the run.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-shortcut-maker-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      # Attaches the APK to a GitHub Release when the build was triggered by a tag.
